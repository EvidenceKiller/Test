apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'
apply plugin: 'kotlin-kapt'

def lpFile = project.rootProject.file("local.properties")
def inputStream = lpFile.newDataInputStream()
def properties = new Properties()
properties.load(inputStream)

android {
    namespace 'com.adl.ts.general'

    compileSdk 34
    packagingOptions{
        pickFirst 'lib/arm64-v8a/libUVCCamera.so'
        pickFirst 'lib/arm64-v8a/libjpeg-turbo212.so'
        pickFirst 'lib/arm64-v8a/libusb1.0.so'
        pickFirst 'lib/arm64-v8a/libuvc.so'
        pickFirst 'lib/armeabi-v7a/libUVCCamera.so'
        pickFirst 'lib/armeabi-v7a/libjpeg-turbo212.so'
        pickFirst 'lib/armeabi-v7a/libusb1.0.so'
        pickFirst 'lib/armeabi-v7a/libuvc.so'
    }

    if (properties.containsKey('store.filePath')) {
        signingConfigs {
            release {
                storeFile file(properties.getProperty('store.filePath'))
                storePassword properties.getProperty('store.filePassword')
                keyAlias properties.getProperty('store.keyAlias')
                keyPassword properties.getProperty('store.keyPassword')
            }
        }
    }

    defaultConfig {
        applicationId "com.adl.ts.general.web"
        minSdkVersion 26
        targetSdkVersion 29
        versionCode 4
        versionName "1.0.2.8"

        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {

        debug {
            buildConfigField "boolean", "LOG_DEBUG", "true"

            if (properties.containsKey('store.filePath'))
                signingConfig signingConfigs.release
        }

        release {

            buildConfigField "boolean", "LOG_DEBUG", "false"

            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            if (properties.containsKey('store.filePath'))
                signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            jniLibs.srcDir 'libs'
            jni.srcDirs = []
        }
    }
    buildFeatures {
        viewBinding true
    }

    packagingOptions {

    }

    android.applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def versionName = variant.getVersionName()
            def versionCode = variant.getVersionCode()
            def date = new Date().format('yyyyMMddHHmmss')

            def buildTypeName
            if (variant.buildType.name == "debug") {
                buildTypeName = "beta"
            } else {
                buildTypeName = variant.buildType.name
            }

            outputFileName = "NZTD-Ts-General-V${versionName}-${buildTypeName}-${date}.apk"
        }
    }

    packagingOptions {
//        pickFirst 'lib/arm64-v8a/libHCCore.so'
        pickFirst '**/libarm64-v8a/*.so'

    }

    lint {
        baseline = file("lint-baseline.xml")
    }

    buildFeatures {
        buildConfig true
    }
}

repositories {
    mavenCentral()
    flatDir {
        dirs 'libs', '../AdlLib/libs'  // aar目录
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])

    implementation "androidx.core:core-ktx:1.8.0"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.1'
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation "androidx.recyclerview:recyclerview:1.2.1"
    implementation "androidx.cardview:cardview:1.0.0"
    implementation 'com.google.android:flexbox:2.0.1'
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.0"
    implementation 'androidx.work:work-runtime-ktx:2.7.0'
    implementation 'androidx.concurrent:concurrent-futures-ktx:1.1.0'

    //  Rxjava
    implementation 'io.reactivex.rxjava2:rxjava:2.2.14'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'com.jakewharton.rxbinding2:rxbinding:2.2.0'

    //  Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.jakewharton.retrofit:retrofit2-kotlin-coroutines-adapter:0.9.2'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.7.2'
    implementation 'com.squareup.okhttp3:okhttp:4.9.1'

    //  Glide
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    kapt 'com.github.bumptech.glide:compiler:4.12.0'

    //  图片缩放
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'

    def camerax_version = "1.1.0"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    implementation 'com.google.zxing:core:3.4.1'

    //  WebSocket
    implementation 'org.java-websocket:Java-WebSocket:1.5.3'

    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    implementation 'javax.annotation:javax.annotation-api:1.2'

    implementation "com.android.support:multidex:1.0.3"

    // add by Nan.Shan 2022.4.24
    implementation 'com.google.mlkit:pose-detection:18.0.0-beta2'
    implementation 'com.google.mlkit:pose-detection-accurate:18.0.0-beta2'
    implementation "androidx.work:work-multiprocess:2.7.0"

    // Android 6.0 权限
    implementation 'com.yanzhenjie:permission:2.0.3'

    implementation 'com.qiniu:qiniu-android-sdk:8.5.1'

    //loraSdk
    implementation 'com.github.Liuguihong:AndroidUsbSerialSdk:1.0.0'

    // 授权相关
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.66'

    //implementation project(path: ':AdlBase')
    implementation project(path: ':AdlWebService')

    implementation(name: 'AdlPose-2025-04-29', ext: 'aar')
    implementation(name: 'AdlPoseCore-2026-01-26', ext: 'aar')

    implementation(name: 'AdlPoseSdk-2025-11-07', ext: 'aar')
    implementation(name: 'AdlPoseGt-2025-10-17', ext: 'aar')

    implementation(name: 'NzAuthCore-v2.0.1-2026-02-02', ext: 'aar')
    implementation(name: 'AdlSportGeneral-2025-12-05', ext: 'aar')
    implementation(name: 'ZySportCore-2025-04-21', ext: 'aar')

    implementation(name: 'NzLongJump-2026-01-19', ext: 'aar')
    implementation(name: 'AdlBase-2026-03-10', ext: 'aar')

    implementation(name: 'tool-release', ext: 'aar')

    implementation(name: 'AdlCamera-2026-03-23', ext: 'aar')
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.0")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.0")

    implementation 'com.google.android.exoplayer:exoplayer-core:2.18.5' // 替换x.x为最新版本号
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.18.5' // 如果你需要HLS支持的话，可以添加此依赖
    implementation 'com.google.android.exoplayer:exoplayer-rtsp:2.18.5'
    implementation 'org.videolan.android:libvlc-all:3.4.1'
}